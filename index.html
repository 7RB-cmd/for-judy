<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Judy ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0a10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 75, 110, 0.3);
      padding: 30px 20px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      width: 100%;
      max-width: 380px;
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 15px;
      color: #ff477e;
      text-shadow: 0 0 10px rgba(255, 71, 126, 0.4);
    }

    p {
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 25px;
      color: #e2e8f0;
      word-wrap: break-word;
    }

    .btn {
      background: linear-gradient(45deg, #ff477e, #ff70a6);
      border: none;
      color: white;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: none;
    }

    #finalMessage {
      display: none;
      position: absolute;
      z-index: 20;
      font-size: 2rem;
      font-weight: bold;
      color: #ff477e;
      text-shadow: 0 0 15px rgba(255, 71, 126, 0.8);
      font-family: 'Courier New', Courier, monospace;
      animation: pulse 2s infinite ease-in-out;
      width: 90%;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <div class="card fade-in" id="card">
    <h1 id="title">Hey Judy... ✨</h1>
    <p id="text">I made something special just for you. Are you ready?</p>
    <button class="btn" id="actionBtn" onclick="nextStep()">Open 💌</button>
  </div>

  <div id="finalMessage">love u judy &lt;3</div>

  <canvas id="canvas"></canvas>

  <script>
    const steps = [
      {
        title: "About You ✨",
        text: "February 3, 2010 was a truly special day because the world got brighter when you were born. You are remarkably beautiful, smart, and loved by everyone around you. I know with all my heart that you will fulfill your dream and become an incredible pediatric surgeon!",
        btnText: "Tap to Continue 👉"
      },
      {
        title: "About Our Relationship 💑",
        text: "I met you in 2025, and right from the start, you were completely different from anyone else—something about you drew me in instantly. On August 27, 2025, I confessed my feelings to you, and it was the best decision I ever made. Despite every hardship we faced, I still love you today, I will love you forever, and one day you will be my wife.",
        btnText: "Tap to Continue 👉"
      },
      {
        title: "My Wishes For You 🤲❤️",
        text: "I pray that you always stay safe and protected from any harm or hate, and that you stay by my side for the rest of our lives. May all your dreams come true, and may I see you as the greatest surgeon in Egypt and the entire world.",
        btnText: "Final Surprise ✨"
      }
    ];

    let currentStep = 0;

    function nextStep() {
      const card = document.getElementById('card');
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const btn = document.getElementById('actionBtn');

      card.classList.remove('fade-in');

      setTimeout(() => {
        if (currentStep < steps.length) {
          title.innerText = steps[currentStep].title;
          text.innerText = steps[currentStep].text;
          btn.innerText = steps[currentStep].btnText;
          currentStep++;
          card.classList.add('fade-in');
        } else {
          card.style.display = 'none';
          startAnimationSequence();
        }
      }, 150);
    }

    function startAnimationSequence() {
      const canvas = document.getElementById('canvas');
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let stage = 1;
      let heartPoints = [];
      let particles = [];
      let timer = 0;

      let scale = Math.min(canvas.width, canvas.height) / 45;

      for (let t = 0; t < Math.PI * 2; t += 0.05) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        heartPoints.push({
          x: canvas.width / 2 + x * scale,
          y: canvas.height / 2 + y * scale
        });
      }

      for (let i = 0; i < 50; i++) {
        particles.push({
          targetIndex: Math.floor(Math.random() * heartPoints.length),
          x: canvas.width / 2 + (Math.random() - 0.5) * 300,
          y: canvas.height / 2 + (Math.random() - 0.5) * 300,
          speed: Math.random() * 0.08 + 0.03
        });
      }

      let floatingHearts = [];
      const colors = ['#ff477e', '#ff70a6', '#ff0055', '#ff9ebb'];

      function createFloatingHeart() {
        return {
          x: Math.random() * canvas.width,
          y: canvas.height + Math.random() * 30,
          speed: Math.random() * 2 + 1.5,
          size: Math.random() * 12 + 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          sway: Math.random() * 2 - 1
        };
      }

      function animate() {
        ctx.fillStyle = "rgba(11, 10, 16, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (stage === 1) {
          timer++;
          ctx.strokeStyle = '#ff2a75';
          ctx.lineWidth = 1.5;

          particles.forEach((p, i) => {
            let target = heartPoints[p.targetIndex];
            p.x += (target.x - p.x) * p.speed;
            p.y += (target.y - p.y) * p.speed;

            if (Math.hypot(target.x - p.x, target.y - p.y) < 5) {
              p.targetIndex = (p.targetIndex + 5) % heartPoints.length;
            }

            particles.forEach((p2, j) => {
              if (i !== j) {
                let dist = Math.hypot(p.x - p2.x, p2.y - p.y);
                if (dist < 40) {
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              }
            });
          });

          if (timer > 160) {
            stage = 2;
            for (let i = 0; i < 35; i++) {
              floatingHearts.push(createFloatingHeart());
            }
            const finalMsg = document.getElementById('finalMessage');
            finalMsg.style.display = 'block';
            finalMsg.classList.add('fade-in');
          }

        } else if (stage === 2) {
          if (Math.random() < 0.35) {
            floatingHearts.push(createFloatingHeart());
          }

          floatingHearts.forEach((h, index) => {
            h.y -= h.speed;
            h.x += Math.sin(h.y * 0.02) * h.sway;
            
            ctx.font = `${h.size}px Arial`;
            ctx.fillStyle = h.color;
            ctx.fillText("❤️", h.x, h.y);

            if (h.y < -30) floatingHearts.splice(index, 1);
          });
        }

        requestAnimationFrame(animate);
      }

      animate();
    }
  </script>
</body>
</html>
