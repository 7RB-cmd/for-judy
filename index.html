<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For Judy ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0a10;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 75, 110, 0.3);
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      width: 85%;
      max-width: 380px;
      z-index: 10;
      transition: all 0.5s ease-in-out;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 15px;
      color: #ff477e;
      text-shadow: 0 0 10px rgba(255, 71, 126, 0.4);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 25px;
      color: #e2e8f0;
    }

    .btn {
      background: linear-gradient(45deg, #ff477e, #ff70a6);
      border: none;
      color: white;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in-out forwards;
    }

    .fade-out {
      animation: fadeOut 0.3s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* حاوية القلب متسنترة في الموبايل بالظبط */
    #heartContainer {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 260px;
      height: 260px;
      z-index: 15;
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    /* الجملة النهائية في نص الشاشة بالضبط */
    #finalMessage {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      font-size: 1.9rem;
      font-weight: bold;
      color: #ff477e;
      text-shadow: 0 0 20px rgba(255, 71, 126, 0.9);
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
      animation: pulse 2.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.06); }
    }
  </style>
</head>
<body>

  <div class="card fade-in" id="card">
    <h1 id="title">Hey Judy... ✨</h1>
    <p id="text">I made something special just for you. Are you ready?</p>
    <button class="btn" id="actionBtn" onclick="nextStep()">Open 💌</button>
  </div>

  <!-- حاوية القلب -->
  <div id="heartContainer">
    <canvas id="canvas"></canvas>
  </div>

  <!-- الجملة النهائية -->
  <div id="finalMessage">love u judy &lt;3</div>

  <script>
    const steps = [
      {
        title: "About You ✨",
        text: "February 3, 2010 was a truly special day because the world got brighter when you were born. You are remarkably beautiful, smart, and loved by everyone around you. I know with all my heart that you will achieve your dream and become an incredible pediatric surgeon!",
        btnText: "Tap to Continue 👉"
      },
      {
        title: "About Our Relationship 💑",
        text: "I met you in 2025, and right from the start, you were completely different from anyone else. Something about you drew me in instantly. On August 27, 2025, I confessed my feelings to you, and it was the best decision I ever made. Despite every hardship we faced, I still love you today, I will love you forever, and one day you will be my wife.",
        btnText: "Tap to Continue 👉"
      },
      {
        title: "My Wishes For You 🤲❤️",
        text: "I pray that you always stay safe and protected from any harm or hate, and that you stay by my side for the rest of our lives. May all your dreams come true, and may I see you as the greatest surgeon in Egypt and the entire world.",
        btnText: "Final Surprise ✨"
      }
    ];

    let currentStep = 0;

    function nextStep() {
      const card = document.getElementById('card');
      const title = document.getElementById('title');
      const text = document.getElementById('text');
      const btn = document.getElementById('actionBtn');

      card.classList.remove('fade-in');

      setTimeout(() => {
        if (currentStep < steps.length) {
          title.innerText = steps[currentStep].title;
          text.innerText = steps[currentStep].text;
          btn.innerText = steps[currentStep].btnText;
          currentStep++;
          card.classList.add('fade-in');
        } else {
          card.style.display = 'none';
          startAnimationSequence();
        }
      }, 150);
    }

    function startAnimationSequence() {
      const heartContainer = document.getElementById('heartContainer');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      heartContainer.style.display = 'block';
      canvas.width = 260;
      canvas.height = 260;

      let heartPoints = [];
      let drawingProgress = 0;

      for (let t = 0; t < Math.PI * 2; t += 0.05) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        heartPoints.push({
          x: 130 + x * 6.5,
          y: 115 + y * 6.5
        });
      }

      function animate() {
        ctx.fillStyle = "rgba(11, 10, 16, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#ff477e';
        ctx.lineWidth = 3.5;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff477e';

        ctx.beginPath();
        let currentMax = Math.floor(drawingProgress);
        for (let i = 0; i < currentMax && i < heartPoints.length; i++) {
          if (i === 0) ctx.moveTo(heartPoints[i].x, heartPoints[i].y);
          else ctx.lineTo(heartPoints[i].x, heartPoints[i].y);
        }
        ctx.stroke();
        ctx.shadowBlur = 0;

        if (drawingProgress < heartPoints.length) {
          drawingProgress += 1.8; // سرّعنا رسم القلب شوية عشان ما يطولش
          requestAnimationFrame(animate);
        } else {
          // اختفاء مباشر وسريع في نفس المكان من غير أي زحزحة
          heartContainer.classList.add('fade-out');

          setTimeout(() => {
            heartContainer.style.display = 'none';
            const finalMsg = document.getElementById('finalMessage');
            finalMsg.style.display = 'block';
            finalMsg.classList.add('fade-in');
          }, 300);
        }
      }

      animate();
    }
  </script>
</body>
</html>
